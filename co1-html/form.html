<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form ElementDemo</title>
</head>
<body>
    <h1 style="text-align: center;">Welcome to My Portfolio</h1>
    <form  action = "#" method="get"></form>
    <fieldset>
        <legend>Personal Information</legend>
        <label>Full Name</label><br>
        <input type="text" id="fname" name="fname" placeholder="Enter Your FullName" required/><br>
    </br>
        
        <label>Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter Email" required/><br>
    </br>

        <label>Password</label><br>
        <input type="pass" id="pass" name="pass" placeholder="Enter Password" required/><br>
    </br>

        <label>DOB</label><br>
        <input type="date" id="dob" name="dob" placeholder="DD/MM/YYYY" required/><br>
    </br>

        <label>Website url</label><br>
        <input type="url" id="website" name="website" placeholder="Enter Website URL" required/><br>
    </br>
        <input type="submit" value="Submit">

    </fieldset>

    <fieldset>
    <legend>Prefernces</legend>
    
        <label>Select Gender</label><br>
        <label>Male</label> <br>
        <input type="radio" id="Male" name="gender" value="Male" required/> <br>
        <label>Female</label><br>
        <input type="radio" id="Female" name="gender" value="Female" required/> <br>
        <label>Other</label><br>
        <input type="radio" id="Other" name="gender" value="Other" required/> <br>
    <br>

    </fieldset>
</body>
</html>
