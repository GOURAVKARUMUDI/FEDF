<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Elementdemo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        ul, ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
        h1 {
            color: darkblue;
        }
        </style>
</head>
<body>
    <h1>Unordered List Items</h1>
    <ul>
        <li>Laptop</li>
        <li>Bag</li>
        <li>University</li>
        <li>Faculty</li>
        <li style="color: green;">Beautiful Girls</li>  
    </ul>
    <ol>
        <h1>My Instrested Subjects</h1>
        <li>Front End Frame Work development</li>
         <li>Back End Frame Work development</li>
          <li>Full Stack Frame Work development</li>
    </ol>
</body>
</html>
