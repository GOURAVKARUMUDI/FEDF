<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Demonstration</title>
</head>
<body>
    <h1>Switch Demonstration in JS</h1>
    <p id="demo"></p>
    <script>
        let day = parseInt(prompt("Enter a number between 1 and 7:"));
        let message;

        switch(day) {
            case 1:
                message = "Monday";
                break;
            case 2:
                message = "Tuesday";
                break;
            case 3:
                message = "Wednesday";
                break;
            case 4:
                message = "Thursday";
                break;
            case 5:
                message = "Friday";
                break;
            case 6:
                message = "Saturday";
                break;
            case 7:
                message = "Sunday";
                break;
            default:
                message = "Invalid input! Please enter a number between 1 and 7.";
                break;
        }

        document.getElementById("demo").innerText = `Day : ${message}`;
        
    </script>
</body>
</html>
